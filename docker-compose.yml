name: echohoard

# Generic reference composition. Supply ECHOHOARD_DATABASE_URL and an image
# reference from the deployment environment; no private host, identity
# provider, storage path, or credential is encoded here.
services:
  web:
    image: ${ECHOHOARD_IMAGE:-echohoard:local}
    environment:
      NODE_ENV: production
      ECHOHOARD_ROLE: web
      OIDC_ISSUER: ${ECHOHOARD_OIDC_ISSUER:-https://auth.example.invalid/}
      OIDC_CLIENT_ID: ${ECHOHOARD_OIDC_CLIENT_ID:-replace-me}
      OIDC_REDIRECT_URI: ${ECHOHOARD_OIDC_REDIRECT_URI:-http://localhost:3000/auth/callback}
      OIDC_ARCHIVE_ID: ${ECHOHOARD_OIDC_ARCHIVE_ID:-00000000-0000-0000-0000-000000000000}
      OIDC_CLIENT_SECRET_FILE: /run/echohoard/secrets/oidc-client-secret
      ECHOHOARD_MCP_CREDENTIAL_FILE: /run/echohoard/secrets/mcp-read-token
      ECHOHOARD_MCP_USER_ID: ${ECHOHOARD_MCP_USER_ID:-replace-me}
      ECHOHOARD_MCP_SUBJECT: ${ECHOHOARD_MCP_SUBJECT:-replace-me}
      ECHOHOARD_MCP_ISSUER: ${ECHOHOARD_MCP_ISSUER:-https://auth.example.invalid/}
      ECHOHOARD_WACLI_CONTROL_URL: ${ECHOHOARD_WACLI_CONTROL_URL:-http://wacli-control:8080/}
      ECHOHOARD_WACLI_WEBHOOK_SECRET_FILE: /run/echohoard/secrets/wacli-webhook-key
      DATABASE_URL: ${ECHOHOARD_DATABASE_URL:-postgresql://echohoard:replace-me@postgres.example.invalid:5432/echohoard?schema=public}
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /app/src/delivery/web/.next/cache
    ports:
      - "${ECHOHOARD_HTTP_PORT:-3000}:3000"
    secrets:
      - source: oidc_client_secret
        target: /run/echohoard/secrets/oidc-client-secret
      - source: mcp_read_token
        target: /run/echohoard/secrets/mcp-read-token
      - source: wacli_webhook_key
        target: /run/echohoard/secrets/wacli-webhook-key
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  wacli-control:
    image: ${ECHOHOARD_WACLI_IMAGE:-echohoard-wacli:local}
    user: "10001:10001"
    command: ["control"]
    environment:
      WACLI_ACCOUNTS: ${ECHOHOARD_WACLI_ACCOUNTS:-account-a,account-b}
      WACLI_ACCOUNT_ROOT: /var/lib/wacli/accounts
      WACLI_WEBHOOK_BASE_URL: http://web:3000/api/internal/live-events
      WACLI_WEBHOOK_SECRET_FILE: /run/secrets/wacli_webhook_key
    volumes:
      - wacli-account-a:/var/lib/wacli/accounts/account-a
      - wacli-account-b:/var/lib/wacli/accounts/account-b
    secrets:
      - wacli_webhook_key
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 768m
    cpus: 1.50
    restart: unless-stopped
    stop_grace_period: 30s
    expose:
      - "8080"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  worker:
    image: ${ECHOHOARD_IMAGE:-echohoard:local}
    user: "10002:10002"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      ECHOHOARD_ROLE: worker
      ECHOHOARD_WORKER_STATUS_FILE: /work/worker.status
      ECHOHOARD_WORKER_KEY_FILE: /run/echohoard/secrets/worker.key
      DATABASE_URL: ${ECHOHOARD_DATABASE_URL:-postgresql://echohoard:replace-me@postgres.example.invalid:5432/echohoard?schema=public}
    volumes:
      - echohoard-data:/data
      - echohoard-work:/work
    secrets:
      - source: worker_key
        target: /run/echohoard/secrets/worker.key
    healthcheck:
      test: ["CMD-SHELL", 'test "$(cat /work/worker.status 2>/dev/null)" = ready']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  echohoard-data:
  echohoard-work:
  wacli-account-a:
  wacli-account-b:

secrets:
  oidc_client_secret:
    file: ${ECHOHOARD_OIDC_CLIENT_SECRET_FILE:-./container/secrets/oidc-client-secret.example}
  worker_key:
    file: ${ECHOHOARD_WORKER_KEY_FILE:-./container/secrets/worker-key.example}
  wacli_webhook_key:
    file: ${ECHOHOARD_WACLI_WEBHOOK_KEY_FILE:-./container/secrets/wacli-webhook-key.example}
  mcp_read_token:
    file: ${ECHOHOARD_MCP_CREDENTIAL_HOST_FILE:-./container/secrets/mcp-read-token.example}

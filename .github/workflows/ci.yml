name: Pull request checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Format
        run: pnpm format
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Architecture boundaries
        run: pnpm architecture

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        run: pnpm exec prisma generate
      - name: Unit tests and coverage
        run: pnpm test:unit

  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: PostgreSQL functional smoke
        run: pnpm test:functional

  browser-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Browser smoke
        run: pnpm test:browser
      - name: Production build
        run: pnpm build

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Container build and role smoke
        run: pnpm test:container

  quality:
    runs-on: ubuntu-latest
    needs: [static, unit, functional, browser-build, container]
    steps:
      - name: Report completed quality gate
        run: echo "All required quality jobs passed."

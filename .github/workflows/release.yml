name: Publish release image

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and publish immutable image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enforce release supply-chain gate
        run: pnpm supply-chain:verify -- --release

      - name: Set up BuildKit
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ github.ref_name }}
            type=sha

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Publish digest evidence
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$DIGEST"
          {
            echo "### EchoHoard release image"
            echo
            echo "- tag: \`${GITHUB_REF_NAME}\`"
            echo "- image: \`${IMAGE}@${DIGEST}\`"
            echo "- commit: \`${GITHUB_SHA}\`"
          } >> "$GITHUB_STEP_SUMMARY"
          printf '{"tag":"%s","image":"%s","digest":"%s","commit":"%s"}\n' \
            "$GITHUB_REF_NAME" "$IMAGE" "$DIGEST" "$GITHUB_SHA" > release-metadata.json

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: echohoard-release-${{ github.ref_name }}
          path: release-metadata.json
          if-no-files-found: error

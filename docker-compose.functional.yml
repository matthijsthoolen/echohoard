services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: echohoard_functional
      POSTGRES_USER: echohoard_test
      POSTGRES_PASSWORD: echohoard_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U echohoard_test -d echohoard_functional"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
